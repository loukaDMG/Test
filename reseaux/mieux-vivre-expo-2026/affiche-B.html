<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mieux Vivre Expo J-7</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0F2219}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0F2219;
    font-family:"Instrument Sans",Arial,sans-serif;color:#fff}
  .photo{position:absolute;left:0;top:150px;width:1080px;height:800px;object-fit:cover;object-position:60% 50%}
  .fade{position:absolute;left:0;top:150px;width:1080px;height:800px;
    background:linear-gradient(180deg,#0F2219 0%,rgba(15,34,25,0) 16%,rgba(15,34,25,0) 50%,rgba(15,34,25,.8) 76%,#0F2219 96%)}
  .logo{position:absolute;left:50%;top:58px;width:400px;transform:translateX(-50%)}
  .badge{position:absolute;right:56px;top:66px;padding:12px 22px;border:1px solid rgba(169,201,179,.6);
    color:#A9C9B3;font-size:20px;font-weight:600;letter-spacing:.2em}
  .kicker{position:absolute;left:0;width:100%;top:744px;text-align:center;color:#A9C9B3;
    font-size:21px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  .t1{position:absolute;left:0;width:100%;top:790px;text-align:center;font-size:88px;font-weight:500;
    letter-spacing:-.035em;line-height:1}
  .t2{position:absolute;left:0;width:100%;top:880px;text-align:center;font-family:"Instrument Serif",Georgia,serif;
    font-style:italic;color:#A9C9B3;font-size:108px;line-height:1}
  .grid{position:absolute;left:70px;top:1030px;width:940px;display:flex}
  .cell{flex:1;text-align:center}
  .cell+.cell{border-left:1px solid rgba(255,255,255,.22)}
  .lab{font-size:17px;font-weight:600;letter-spacing:.22em;color:rgba(255,255,255,.55);text-transform:uppercase}
  .val{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:44px;color:#ECE5D3;line-height:1.1;margin-top:10px;white-space:nowrap}
  .sub{font-size:22px;color:rgba(255,255,255,.75);margin-top:6px;white-space:nowrap}
  .rule{position:absolute;left:70px;top:1200px;width:940px;height:1px;background:rgba(255,255,255,.22)}
  .foot{position:absolute;left:70px;top:1232px;width:940px;display:flex;justify-content:space-between;align-items:center}
  .cta{font-size:26px;font-weight:500}
  .cta span{color:#A9C9B3}
  .contact{text-align:right;font-size:22px;color:rgba(255,255,255,.8);line-height:1.5}
  .contact b{display:block;font-size:34px;font-weight:600;color:#fff;letter-spacing:-.01em;line-height:1.1}
</style>
</head>
<body>
<div class="poster">
  <img class="photo" src="photo-B.jpg" alt="Cuisine extérieure DMG Concept éclairée de nuit">
  <div class="fade"></div>
  <img class="logo" src="logo.png" alt="DMG Concept, l'espace du possible">
  <div class="badge">J-7</div>

  <div class="kicker">Dans une semaine · Salon</div>
  <div class="t1">Rendez-vous à</div>
  <div class="t2">Mieux Vivre Expo.</div>

  <div class="grid">
    <div class="cell"><div class="lab">Dates</div><div class="val">29 oct. → 2 nov.</div><div class="sub">du jeudi au lundi</div></div>
    <div class="cell"><div class="lab">Lieu</div><div class="val">Rochexpo</div><div class="sub">La Roche-sur-Foron</div></div>
    <div class="cell"><div class="lab">Horaires</div><div class="val">10h – 19h</div><div class="sub">nocturne vendredi 22h</div></div>
  </div>

  <div class="rule"></div>
  <div class="foot">
    <div class="cta">Venez voir nos cuisines<br><span>de près, sur le stand.</span></div>
    <div class="contact"><b>07 49 66 12 56</b>contact@dmg-concept.com · dmg-concept.com</div>
  </div>
</div>
</body>
</html>
