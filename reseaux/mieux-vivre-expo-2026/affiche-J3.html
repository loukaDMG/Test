<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Mieux Vivre Expo J-3</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0F2219}
  .poster{position:relative;width:1080px;height:1350px;overflow:hidden;background:#0F2219;
    font-family:"Instrument Sans",Arial,sans-serif;color:#fff}
  .photo{position:absolute;left:0;top:130px;width:1080px;height:890px;object-fit:cover;object-position:var(--pos,50% 50%)}
  .fade{position:absolute;left:0;top:130px;width:1080px;height:890px;
    background:linear-gradient(180deg,#0F2219 0%,rgba(15,34,25,0) 18%,rgba(15,34,25,0) 52%,rgba(15,34,25,.85) 80%,#0F2219 100%)}
  .logo{position:absolute;left:50%;top:58px;width:400px;transform:translateX(-50%)}
  .big{position:absolute;left:62px;top:808px;font-family:"Instrument Serif",Georgia,serif;font-style:italic;
    font-size:250px;line-height:.8;color:#A9C9B3;letter-spacing:-.02em}
  .head{position:absolute;left:440px;top:832px;width:580px}
  .kicker{color:#A9C9B3;font-size:20px;font-weight:600;letter-spacing:.22em;text-transform:uppercase}
  .title{margin-top:14px;font-size:62px;font-weight:500;letter-spacing:-.03em;line-height:1.02}
  .title em{font-family:"Instrument Serif",Georgia,serif;font-weight:400;color:#ECE5D3;font-size:70px}
  .info{position:absolute;left:70px;top:1082px;width:940px;display:flex;border-top:1px solid rgba(255,255,255,.22);
    border-bottom:1px solid rgba(255,255,255,.22)}
  .cell{flex:1;padding:22px 0;text-align:center}
  .cell+.cell{border-left:1px solid rgba(255,255,255,.22)}
  .val{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-size:38px;color:#ECE5D3;line-height:1.1;white-space:nowrap}
  .sub{font-size:21px;color:rgba(255,255,255,.75);margin-top:6px;white-space:nowrap}
  .foot{position:absolute;left:70px;top:1248px;width:940px;display:flex;justify-content:space-between;align-items:center}
  .cta{font-size:25px;font-weight:500;line-height:1.3}
  .cta span{color:#A9C9B3}
  .contact{text-align:right;font-size:21px;color:rgba(255,255,255,.8);line-height:1.45}
  .contact b{display:block;font-size:33px;font-weight:600;color:#fff;line-height:1.1}
</style>
</head>
<body>
<div class="poster">
  <img class="photo" id="photo" src="photo-E.jpg" alt="Cuisine extérieure DMG Concept">
  <div class="fade"></div>
  <img class="logo" src="logo.png" alt="DMG Concept, l'espace du possible">

  <div class="big">J-3</div>
  <div class="head">
    <div class="kicker">Salon Mieux Vivre Expo</div>
    <div class="title">Plus que 3 jours,<br><em>on vous attend.</em></div>
  </div>

  <div class="info">
    <div class="cell"><div class="val">29 oct. → 2 nov.</div><div class="sub">du jeudi au lundi</div></div>
    <div class="cell"><div class="val">Rochexpo</div><div class="sub">La Roche-sur-Foron</div></div>
    <div class="cell"><div class="val">10h – 19h</div><div class="sub">nocturne vendredi 22h</div></div>
  </div>

  <div class="foot">
    <div class="cta">Venez voir nos cuisines<br><span>de près, sur le stand.</span></div>
    <div class="contact"><b>07 49 66 12 56</b>contact@dmg-concept.com · dmg-concept.com</div>
  </div>
</div>
<script>
  // ?p=F&pos=50%25%2040%25 : choisit la photo et son cadrage
  const q = new URLSearchParams(location.search);
  if (q.get('p')) document.getElementById('photo').src = 'photo-' + q.get('p') + '.jpg';
  if (q.get('pos')) document.getElementById('photo').style.setProperty('--pos', q.get('pos'));
</script>
</body>
</html>
